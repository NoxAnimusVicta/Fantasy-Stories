<style>:root{color-scheme:dark;--gold:#d5b778;--ink:#f3edda;--line:#454c40;--panel:#19231f}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:radial-gradient(ellipse at 14% 20%,#233c34 0,transparent 53%),#101714;font:16px/1.55 system-ui,sans-serif;min-height:100vh}header{background:#101913;border-bottom:1px solid #63583e;padding:16px max(5vw,env(safe-area-inset-left));display:flex;align-items:center;justify-content:space-between}header strong{font:small-caps 600 clamp(19px,3vw,30px) Georgia,serif;letter-spacing:.04em}header small{color:var(--gold)}main{max-width:1220px;margin:auto;display:grid;grid-template-columns:175px 1fr;gap:clamp(20px,4vw,60px);padding:36px 4vw 60px}nav{display:flex;flex-direction:column;align-self:start;gap:6px;border-top:1px solid var(--line);padding-top:15px}nav a{color:#c9d2c6;text-decoration:none;font:600 15px/1.3 system-ui;padding:15px 12px;border-left:2px solid transparent;display:flex;align-items:center;gap:10px}nav a:before{color:var(--gold);font-size:19px}nav a:nth-child(1):before{content:'♙'}nav a:nth-child(2):before{content:'✧'}nav a:nth-child(3):before{content:'▧'}nav a:nth-child(4):before{content:'❧'}nav a[aria-current]{background:#2b382e;color:#fff0cb;border-color:var(--gold)}#record{min-width:0}h1,h2,dd{font-family:Georgia,serif}h1{font-weight:400;font-size:clamp(34px,5vw,60px);line-height:1;margin:0 0 22px}h2{font-weight:400;color:var(--gold)}.sheet{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}.plate{position:relative;display:block;border:1px solid #937c51;background:#212d24;padding:5px;box-shadow:0 14px 35px #0005}.plate img{display:block;width:100%;height:auto}.plate span{position:absolute;bottom:12px;right:12px;background:#101914de;padding:5px 10px;font-size:12px;color:white}.stats{margin:0;display:grid;gap:10px}.stats div,details,.story{background:linear-gradient(115deg,#25342b,#19231f);border:1px solid var(--line);padding:16px 20px}.stats dt,article>small{font:600 11px/1.4 system-ui;letter-spacing:.13em;text-transform:uppercase;color:var(--gold)}.stats dd{margin:6px 0 0;font-size:19px}.stats div:first-child dd{font-size:29px}.stats div:last-child dd{font:15px/1.6 system-ui}details,.story{margin:10px 0}summary{cursor:pointer;min-height:44px;font-weight:600}summary small{display:block;color:#c4cdbd;font-weight:400}a:focus-visible,summary:focus-visible{outline:3px solid #f1c56c;outline-offset:2px}.story h2{margin-top:0}.story p{margin-bottom:0}p{max-width:65ch}[hidden]{display:none!important}@media(max-width:760px){main{display:block;padding:0 16px 28px}nav{position:sticky;top:0;z-index:2;flex-direction:row;justify-content:space-between;gap:0;background:#101914f7;padding:4px 0;margin-bottom:22px;border-top:0;border-bottom:1px solid var(--line)}nav a{flex:1;justify-content:center;flex-direction:column;gap:0;font-size:12px;padding:6px 2px;border-left:0;border-bottom:2px solid transparent}.sheet{grid-template-columns:1fr;gap:14px}.plate{width:min(100%,440px);margin:auto}.plate img{height:min(54svh,450px);object-fit:contain;background:#121b16}.stats{grid-template-columns:1fr 1fr}.stats div{padding:12px}.stats div:nth-child(n+3){grid-column:1/-1}.stats div:first-child dd{font-size:20px}header{padding:12px 16px}h1{margin-bottom:14px}}</style></head>
