<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="campaign-checkpoint" content="arrival-premise-before-play"><title>Threshold · Campaign journal</title><style>
*{box-sizing:border-box}body{margin:0;background:#ece9dd;color:#282f26;font:17px/1.55 Georgia,serif}header,main,footer{max-width:1140px;margin:auto;padding:20px 5%}header{display:flex;justify-content:space-between;border-bottom:1px solid #b8b5a6;align-items:center}small,nav,a,summary,b,label{font:600 13px/1.5 system-ui,sans-serif}header strong{font-size:24px}small{letter-spacing:.12em;text-transform:uppercase;color:#52614f}.hero{display:grid;grid-template-columns:1fr 1fr;background:#26362c;color:#faf4e6;margin:16px 0 25px}.hero img{width:100%;height:100%;max-height:525px;object-fit:cover;object-position:center 23%}.intro{padding:clamp(24px,5vw,70px);align-self:center}.intro small{color:#c6d2b2}h1{font:normal clamp(44px,6vw,84px)/.98 Georgia;margin:20px 0}h2{font:normal 34px Georgia;margin:22px 0 12px}h3{font:normal 24px Georgia}nav{display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid #999f8b}nav a{padding:14px;color:#394734;text-decoration:none}nav a[aria-current]{background:#364733;color:white}a{color:#41553b}details{border-bottom:1px solid #b5b6a9;padding:6px 0}summary{font-size:16px;cursor:pointer;padding:12px 2px}article{max-width:770px;min-height:210px}p{max-width:66ch}footer{color:#535c50}a:focus-visible,summary:focus-visible{outline:3px solid #967222;outline-offset:2px}[hidden]{display:none}@media(max-width:640px){.hero{grid-template-columns:1fr}.hero img{height:320px;object-position:center 17%}.intro{padding:23px}.intro p{margin-bottom:0}header small{font-size:10px}nav a{padding:12px 8px}}
</style><header><strong>Threshold</strong><small>The Lich King’s War</small></header><main><div class="hero"><div style="padding:24px;align-self:center;color:white"><img id="portrait" alt="Your selected arrival portrait" hidden><label for="art">Choose your arrival portrait on this device</label><p><input type="file" accept="image/*" id="art"></p></div><div class="intro"><small>Personal campaign journal</small><h1>The crossing</h1><p>You bring the body you lived in, the mind you learned with, and a hunger that has followed you further than either.</p></div></div><nav aria-label="Journal sections"><a href="#character">Character</a><a href="#mana">Mana</a><a href="#inventory">On you</a><a href="#origin">Origin</a></nav>
<div id="records" aria-live="polite">Loading journal…</div></main><footer>Campaign checkpoint · Before play</footer><script>document.querySelector('#art').onchange=e=>{const file=e.target.files[0];if(file){const img=document.querySelector('#portrait');img.src=URL.createObjectURL(file);img.hidden=false}};async function init(){const data=await fetch('./campaign.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error();return r.json()});const records=document.querySelector('#records');records.replaceChildren();for(const entry of data.sections){const section=document.createElement('article');section.id=entry.id;section.innerHTML=entry.body;records.append(section)}document.querySelector('footer').textContent='Campaign checkpoint · '+data.checkpoint;const sections=[...document.querySelectorAll('article')],links=[...document.querySelectorAll('nav a')];function show(){const id=sections.some(s=>'#'+s.id===location.hash)?location.hash:'#character';sections.forEach(s=>s.hidden='#'+s.id!==id);links.forEach(a=>a.hash===id?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'))}show();window.addEventListener('hashchange',show)}init().catch(()=>document.querySelector('#records').textContent='The campaign record could not load. Refresh to retry.')</script></html>
